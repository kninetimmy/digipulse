name: CI

# Runs the pytest suite on pull requests targeting main. This job never
# contacts a reflector and never fetches a RefCheck.Radio hostfile -- the
# suite runs entirely against synthetic fixtures (see tests/fixtures.py),
# so the only network access here is pip installing packages from PyPI.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # 3.8 is the floor ysfprobe.py actually supports: it imports httpx
      # unconditionally, and httpx's own Requires-Python is >=3.8.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # requirements-dev.txt declares only pytest -- ysfprobe.py hard-exits
      # at import time if httpx is missing, so it must be installed here
      # explicitly rather than assumed present.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt httpx

      - name: Run test suite
        run: pytest
